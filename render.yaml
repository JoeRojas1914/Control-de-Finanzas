services:
  - type: web
    name: finanzas
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASS
        sync: false
