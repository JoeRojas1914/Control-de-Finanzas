<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Finanzas</title>
  <script>if(localStorage.getItem('tema')==='obscuro')document.documentElement.classList.add('dark')</script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <main class="container">

    <div class="metrics-grid">
      <div class="metric-card">
        <p class="metric-label">Patrimonio total</p>
        <p class="metric-value" id="patrimonio">—</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">Rendimiento hoy</p>
        <p class="metric-value green" id="rend-diario">—</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">Rendimiento este mes</p>
        <p class="metric-value green" id="rend-mensual">—</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">Deuda tarjeta</p>
        <p class="metric-value red" id="deuda">—</p>
      </div>
    </div>

    <div class="grid-2">

      <div class="card">
        <h2 class="card-title">Cuentas de débito</h2>
        <div id="lista-cuentas">Cargando...</div>
      </div>

      <div class="card">
        <h2 class="card-title">Registrar rendimiento</h2>
        <div class="form-group">
          <label>Cuenta</label>
          <select id="rend-cuenta"></select>
        </div>
        <div class="form-group">
          <label>Monto del día ($)</label>
          <input type="number" id="rend-monto" step="0.01" placeholder="ej: 9.82">
        </div>
        <button class="btn-primary" onclick="registrarRendimiento()">Registrar</button>
      </div>

    </div>

    <div class="card">
      <h2 class="card-title">Últimos movimientos</h2>
      <table class="tabla">
        <thead>
          <tr>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Cuenta</th>
            <th>Fecha</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody id="tabla-tx"></tbody>
      </table>
    </div>

  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/navbar.js"></script>
  <script src="/static/js/dashboard.js"></script>

</body>
</html>
