<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes</title>
  <script>if(localStorage.getItem('tema')==='obscuro')document.documentElement.classList.add('dark')</script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <main class="container">

    <div class="grid-2">
      <div class="card">
        <h2 class="card-title">Gastos por categoría — este mes</h2>
        <canvas id="grafica-categorias" height="260"></canvas>
        <div id="sin-gastos" style="text-align:center;color:#999;padding:40px;display:none">
          Sin gastos registrados este mes
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">Rendimientos acumulados — este mes</h2>
        <div id="tabla-rendimientos">Cargando...</div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Ingresos vs gastos — últimos 6 meses</h2>
      <canvas id="grafica-ingresos-gastos" height="120"></canvas>
    </div>

    <div class="card">
      <h2 class="card-title">Evolución del patrimonio — últimos 30 días</h2>
      <canvas id="grafica-patrimonio" height="120"></canvas>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/navbar.js"></script>
  <script src="/static/js/movimiento.js"></script>
  <script src="/static/js/reportes.js"></script>

</body>
</html>
