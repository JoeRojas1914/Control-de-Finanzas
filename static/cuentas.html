<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentas</title>
  <script>if(localStorage.getItem('tema')==='obscuro')document.documentElement.classList.add('dark')</script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h2 class="card-title" style="margin:0">Mis cuentas</h2>
        <button class="btn-sm" onclick="abrirModal()">+ Agregar cuenta</button>
      </div>
      <div id="lista-cuentas-detalle">Cargando...</div>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:420px;margin:20px">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <h2 class="card-title" style="margin:0">Nueva cuenta</h2>
        <button onclick="cerrarModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted)">✕</button>
      </div>

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="nueva-nombre" placeholder="ej: BBVA, Mercado Pago...">
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="nueva-tipo">
          <option value="debito">Débito</option>
          <option value="credito">Crédito</option>
        </select>
      </div>
      <div class="form-group" id="grupo-limite" style="display:none">
        <label>Límite de crédito ($)</label>
        <input type="number" id="nueva-limite" step="0.01" placeholder="ej: 20000">
      </div>
      <div class="form-group">
        <label>Saldo inicial ($)</label>
        <input type="number" id="nueva-saldo" step="0.01" placeholder="ej: 5000">
      </div>

      <button class="btn-primary" onclick="agregarCuenta()">Guardar</button>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/navbar.js"></script>
  <script src="/static/js/movimiento.js"></script>
  <script src="/static/js/cuentas.js"></script>

</body>
</html>
