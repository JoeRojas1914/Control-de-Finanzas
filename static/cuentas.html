<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentas — Finanzas</title>
  <script>if(localStorage.getItem('tema')==='obscuro')document.documentElement.classList.add('dark')</script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div class="cuentas-layout">

      <!-- Panel izquierdo: lista de cuentas -->
      <div class="cuentas-panel-izq">
        <div class="cuentas-panel-izq-header">
          <h2 class="card-title" style="margin:0">Mis cuentas</h2>
          <button class="btn-sm" onclick="abrirModalNueva()">+ Agregar</button>
        </div>
        <div id="lista-panel">
          <div class="empty-state">Cargando...</div>
        </div>
      </div>

      <!-- Panel derecho: detalle de cuenta seleccionada -->
      <div class="cuentas-panel-der" id="detalle-panel">
        <div class="detalle-placeholder">Selecciona una cuenta para ver su detalle</div>
      </div>

    </div>
  </main>

  <!-- Modal: Nueva cuenta -->
  <div id="modal-nueva" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0">Nueva cuenta</h2>
        <button class="modal-close" onclick="cerrarModalNueva()">✕</button>
      </div>
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="nueva-nombre" placeholder="ej: BBVA, Mercado Pago...">
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="nueva-tipo">
          <option value="debito">Débito</option>
          <option value="credito">Crédito</option>
        </select>
      </div>
      <div class="form-group" id="grupo-limite" style="display:none">
        <label>Límite de crédito ($)</label>
        <input type="number" id="nueva-limite" step="0.01" placeholder="ej: 20000">
      </div>
      <div class="form-group">
        <label>Saldo inicial ($)</label>
        <input type="number" id="nueva-saldo" step="0.01" placeholder="ej: 5000">
      </div>
      <button class="btn-primary" onclick="agregarCuenta()">Guardar</button>
    </div>
  </div>

  <!-- Modal: Editar cuenta -->
  <div id="modal-editar" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0">Editar cuenta</h2>
        <button class="modal-close" onclick="cerrarModalEditar()">✕</button>
      </div>
      <input type="hidden" id="editar-id">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="editar-nombre">
      </div>
      <div class="form-group" id="editar-grupo-limite" style="display:none">
        <label>Límite de crédito ($)</label>
        <input type="number" id="editar-limite" step="0.01">
      </div>
      <div class="form-group">
        <label id="editar-saldo-label">Saldo actual ($)</label>
        <input type="number" id="editar-saldo" step="0.01">
      </div>
      <button class="btn-primary" onclick="guardarEdicion()">Guardar cambios</button>
    </div>
  </div>

  <!-- Modal: Editar rendimiento -->
  <div id="modal-editar-rend" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0">Editar rendimiento</h2>
        <button class="modal-close" onclick="cerrarModalRend()">✕</button>
      </div>
      <input type="hidden" id="rend-editar-id">
      <div class="form-group">
        <label>Monto ($)</label>
        <input type="number" id="rend-editar-monto" step="0.01">
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="rend-editar-fecha">
      </div>
      <button class="btn-primary" onclick="guardarEdicionRend()">Guardar cambios</button>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/navbar.js"></script>
  <script src="/static/js/movimiento.js"></script>
  <script src="/static/js/cuentas.js"></script>

</body>
</html>
