<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentas — Finanzas</title>
  <script>if(localStorage.getItem('tema')==='obscuro')document.documentElement.classList.add('dark')</script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div class="cuentas-layout">

      <!-- Panel izquierdo: lista de cuentas -->
      <div class="cuentas-panel-izq">
        <div class="cuentas-panel-izq-header">
          <h2 class="card-title" style="margin:0">Mis cuentas</h2>
          <button class="btn-sm" onclick="abrirModalNueva()">+ Agregar</button>
        </div>
        <div id="lista-panel">
          <div class="empty-state">Cargando...</div>
        </div>
      </div>

      <!-- Panel derecho: detalle de cuenta seleccionada -->
      <div class="cuentas-panel-der" id="detalle-panel">
        <div class="detalle-placeholder">Selecciona una cuenta para ver su detalle</div>
      </div>

    </div>
  </main>

  <!-- Modal: Nueva cuenta -->
  <div id="modal-nueva" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0">Nueva cuenta</h2>
        <button class="modal-close" onclick="cerrarModalNueva()">✕</button>
      </div>
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="nueva-nombre" placeholder="ej: BBVA, Mercado Pago...">
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="nueva-tipo">
          <option value="debito">Débito</option>
          <option value="credito">Crédito / Tarjeta</option>
        </select>
      </div>
      <div id="grupo-credito-campos" style="display:none">
      <div class="form-group" id="grupo-limite">
        <label>Límite de crédito ($)</label>
        <input type="number" id="nueva-limite" step="0.01" placeholder="ej: 20000">
      </div>
      <div class="form-group" id="grupo-corte">
        <label>Día de corte <span style="color:var(--text-muted);font-weight:400">(1–30)</span></label>
        <input type="number" id="nueva-corte" min="1" max="30" placeholder="ej: 15"
          oninput="if(this.value>30)this.value=30;if(this.value<1&&this.value!='')this.value=1">
      </div>
      <div class="form-group" id="grupo-pago">
        <label>Día límite de pago <span style="color:var(--text-muted);font-weight:400">(1–30)</span></label>
        <input type="number" id="nueva-pago" min="1" max="30" placeholder="ej: 10"
          oninput="if(this.value>30)this.value=30;if(this.value<1&&this.value!='')this.value=1">
      </div>
      </div><!-- /grupo-credito-campos -->
      <div class="form-group">
        <label>Saldo inicial ($)</label>
        <input type="number" id="nueva-saldo" step="0.01" placeholder="ej: 5000">
      </div>
      <button class="btn-primary" onclick="agregarCuenta()">Guardar</button>
    </div>
  </div>

  <!-- Modal: Editar cuenta -->
  <div id="modal-editar" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0">Editar cuenta</h2>
        <button class="modal-close" onclick="cerrarModalEditar()">✕</button>
      </div>
      <input type="hidden" id="editar-id">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="editar-nombre">
      </div>
      <div id="editar-grupo-credito" style="display:none">
        <div class="form-group">
          <label>Límite de crédito ($)</label>
          <input type="number" id="editar-limite" step="0.01">
        </div>
        <div class="form-group">
          <label>Día de corte <span style="color:var(--text-muted);font-weight:400">(1–30)</span></label>
          <input type="number" id="editar-corte" min="1" max="30" placeholder="ej: 15"
            oninput="if(this.value>30)this.value=30;if(this.value<1&&this.value!='')this.value=1">
        </div>
        <div class="form-group">
          <label>Día límite de pago <span style="color:var(--text-muted);font-weight:400">(1–30)</span></label>
          <input type="number" id="editar-pago" min="1" max="30" placeholder="ej: 10"
            oninput="if(this.value>30)this.value=30;if(this.value<1&&this.value!='')this.value=1">
        </div>
      </div>
      <div class="form-group">
        <label id="editar-saldo-label">Saldo actual ($)</label>
        <input type="number" id="editar-saldo" step="0.01">
      </div>
      <button class="btn-primary" onclick="guardarEdicion()">Guardar cambios</button>
    </div>
  </div>

  <!-- Modal: Editar rendimiento -->
  <div id="modal-editar-rend" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0">Editar rendimiento</h2>
        <button class="modal-close" onclick="cerrarModalRend()">✕</button>
      </div>
      <input type="hidden" id="rend-editar-id">
      <div class="form-group">
        <label>Monto ($)</label>
        <input type="number" id="rend-editar-monto" step="0.01">
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="rend-editar-fecha">
      </div>
      <button class="btn-primary" onclick="guardarEdicionRend()">Guardar cambios</button>
    </div>
  </div>

  <!-- Modal: pago de tarjeta -->
  <div id="modal-pago-tarjeta" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0">Registrar pago de tarjeta</h2>
        <button class="modal-close" onclick="cerrarModalPagoTarjeta()">✕</button>
      </div>
      <div class="form-group">
        <label>Cuenta de origen</label>
        <select id="pago-origen"></select>
      </div>
      <div class="form-group">
        <label>Monto del pago ($)</label>
        <input type="number" id="pago-monto" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" id="pago-descripcion" placeholder="Pago tarjeta">
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="pago-fecha">
      </div>
      <button class="btn-primary" onclick="guardarPagoTarjeta()">Registrar pago</button>
    </div>
  </div>

  <!-- Modal: compra MSI -->
  <div id="modal-msi" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0" id="modal-msi-titulo">Nueva compra MSI</h2>
        <button class="modal-close" onclick="cerrarModalMSI()">✕</button>
      </div>
      <input type="hidden" id="msi-id">
      <input type="hidden" id="msi-cuenta-id">
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" id="msi-descripcion" placeholder="ej: MacBook, TV, Refrigerador...">
      </div>
      <div class="form-group" id="msi-total-group">
        <label>Total de la compra ($)</label>
        <input type="number" id="msi-total" placeholder="0.00" step="0.01" min="0"
          oninput="_actualizarPreviewMSI()">
      </div>
      <div class="form-group">
        <label>Meses sin intereses</label>
        <select id="msi-meses" onchange="_actualizarPreviewMSI()">
          <option value="">— Selecciona —</option>
          <option value="3">3 meses</option>
          <option value="6">6 meses</option>
          <option value="9">9 meses</option>
          <option value="12">12 meses</option>
          <option value="18">18 meses</option>
          <option value="24">24 meses</option>
        </select>
      </div>
      <div class="form-group" id="msi-fecha-group">
        <label>Fecha de la compra</label>
        <input type="date" id="msi-fecha">
      </div>
      <div id="msi-preview" style="font-size:13px;color:var(--text-muted);margin-bottom:16px;padding:10px;background:var(--surface2);border-radius:8px;display:none">
        Mensualidad: <strong id="msi-preview-mensual"></strong>
      </div>
      <button class="btn-primary" onclick="guardarMSI()">Registrar compra</button>
    </div>
  </div>

  <!-- Modal: rendimiento programado (nuevo / editar) -->
  <div id="modal-rendp" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0" id="modal-rendp-titulo">Nuevo rendimiento automático</h2>
        <button class="modal-close" onclick="cerrarModalRendP()">✕</button>
      </div>
      <input type="hidden" id="rendp-id">
      <div class="form-group">
        <label>Cuenta</label>
        <select id="rendp-cuenta"></select>
      </div>
      <div class="form-group">
        <label>Monto por período</label>
        <input type="number" id="rendp-monto" placeholder="ej: 9.82" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>Frecuencia</label>
        <select id="rendp-frecuencia">
          <option value="diaria" selected>Diaria</option>
          <option value="semanal">Semanal</option>
          <option value="quincenal">Quincenal</option>
          <option value="mensual">Mensual</option>
          <option value="anual">Anual</option>
        </select>
      </div>
      <div class="form-group">
        <label>Próxima fecha de aplicación</label>
        <input type="date" id="rendp-proxima-fecha">
      </div>
      <button class="btn-primary" onclick="guardarRendP()">Guardar</button>
    </div>
  </div>

  <!-- Modal: horario semanal de rendimientos -->
  <div id="modal-horario" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0" id="modal-horario-titulo">Horario personalizado</h2>
        <button class="modal-close" onclick="cerrarModalHorario()">✕</button>
      </div>
      <input type="hidden" id="horario-id">
      <div class="form-group">
        <label>Cuenta</label>
        <select id="horario-cuenta"></select>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">
        Deja vacío los días que no recibes rendimiento
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group" style="margin:0">
          <label>Lunes</label>
          <input type="number" id="horario-lunes" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group" style="margin:0">
          <label>Martes</label>
          <input type="number" id="horario-martes" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group" style="margin:0">
          <label>Miércoles</label>
          <input type="number" id="horario-miercoles" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group" style="margin:0">
          <label>Jueves</label>
          <input type="number" id="horario-jueves" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group" style="margin:0">
          <label>Viernes</label>
          <input type="number" id="horario-viernes" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group" style="margin:0">
          <label>Sábado</label>
          <input type="number" id="horario-sabado" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group" style="margin:0">
          <label>Domingo</label>
          <input type="number" id="horario-domingo" placeholder="0.00" step="0.01" min="0">
        </div>
      </div>
      <button class="btn-primary" style="margin-top:18px" onclick="guardarHorario()">Guardar</button>
    </div>
  </div>

  <!-- Modal: recurrente (nueva / editar) -->
  <div id="modal-rec" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0" id="modal-rec-titulo">Nueva recurrente</h2>
        <button class="modal-close" onclick="cerrarModalRec()">✕</button>
      </div>
      <input type="hidden" id="rec-id">
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" id="rec-descripcion" placeholder="ej: Gimnasio, Netflix...">
      </div>
      <div class="form-group">
        <label>Monto</label>
        <input type="number" id="rec-monto" placeholder="0.00" step="0.01">
      </div>
      <div class="form-group">
        <label>Frecuencia</label>
        <select id="rec-frecuencia">
          <option value="diaria">Diaria</option>
          <option value="semanal">Semanal</option>
          <option value="quincenal">Quincenal</option>
          <option value="mensual" selected>Mensual</option>
          <option value="anual">Anual</option>
        </select>
      </div>
      <div class="form-group">
        <label>Próxima fecha</label>
        <input type="date" id="rec-proxima-fecha">
      </div>
      <div class="form-group">
        <label>Cuenta</label>
        <select id="rec-cuenta"></select>
      </div>
      <div class="form-group">
        <label>Categoría (opcional)</label>
        <select id="rec-categoria">
          <option value="">Sin categoría</option>
        </select>
      </div>
      <button class="btn-primary" onclick="guardarRec()">Guardar</button>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/navbar.js"></script>
  <script src="/static/js/movimiento.js"></script>
  <script src="/static/js/cuentas.js"></script>

</body>
</html>
