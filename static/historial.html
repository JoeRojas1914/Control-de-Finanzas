<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial — Finanzas</title>
  <script>if(localStorage.getItem('tema')==='obscuro')document.documentElement.classList.add('dark')</script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <main class="container">

    <!-- Resumen del mes -->
    <div class="metrics-grid" style="margin-bottom:20px">
      <div class="metric-card">
        <p class="metric-label">Rendimientos</p>
        <p class="metric-value green" id="total-rend">—</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">Ingresos</p>
        <p class="metric-value green" id="total-ingresos">—</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">Gastos</p>
        <p class="metric-value red" id="total-gastos">—</p>
      </div>
      <div class="metric-card">
        <p class="metric-label">Balance neto</p>
        <p class="metric-value" id="total-neto">—</p>
      </div>
    </div>

    <div class="card">

      <!-- Filtro de mes -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px">
        <h2 class="card-title" style="margin:0">Historial</h2>
        <select id="filtro-mes" onchange="cambiarMes()" style="width:auto;padding:6px 12px;font-size:13px"></select>
      </div>

      <!-- Filtros -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <input type="text" id="filtro-busqueda" placeholder="Buscar descripción..."
               style="flex:1;min-width:160px" oninput="renderizar()">
        <select id="filtro-categoria" onchange="renderizar()" style="width:auto">
          <option value="">Todas las categorías</option>
        </select>
        <select id="filtro-cuenta" onchange="renderizar()" style="width:auto">
          <option value="">Todas las cuentas</option>
        </select>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="cambiarTab('todos', this)">Todos</button>
        <button class="tab" onclick="cambiarTab('rendimientos', this)">Rendimientos</button>
        <button class="tab" onclick="cambiarTab('ingresos', this)">Ingresos</button>
        <button class="tab" onclick="cambiarTab('gastos', this)">Gastos</button>
      </div>

      <!-- Tabla -->
      <table class="tabla">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Cuenta</th>
            <th>Fecha</th>
            <th style="text-align:right">Monto</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-historial"></tbody>
      </table>

    </div>

  </main>

  <!-- Modal editar transacción -->
  <div id="modal-editar-tx" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="card-title" style="margin:0">Editar transacción</h2>
        <button class="modal-close" onclick="cerrarModalTx()">✕</button>
      </div>
      <input type="hidden" id="tx-id">
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" id="tx-descripcion">
      </div>
      <div class="form-group">
        <label>Monto (negativo = gasto)</label>
        <input type="number" id="tx-monto" step="0.01">
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="tx-fecha">
      </div>
      <div class="form-group">
        <label>Cuenta</label>
        <select id="tx-cuenta"></select>
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="tx-categoria"></select>
      </div>
      <button class="btn-primary" onclick="guardarTx()">Guardar cambios</button>
    </div>
  </div>

  <!-- Modal editar rendimiento -->
  <div id="modal-editar-rend" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:420px;margin:20px">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <h2 class="card-title" style="margin:0">Editar rendimiento</h2>
        <button onclick="cerrarModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted)">✕</button>
      </div>

      <input type="hidden" id="editar-id">

      <div class="form-group">
        <label>Cuenta</label>
        <select id="editar-cuenta"></select>
      </div>
      <div class="form-group">
        <label>Monto ($)</label>
        <input type="number" id="editar-monto" step="0.01">
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="editar-fecha">
      </div>

      <button class="btn-primary" onclick="guardarEdicion()">Guardar cambios</button>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/navbar.js"></script>
  <script src="/static/js/movimiento.js"></script>
  <script src="/static/js/historial.js"></script>

</body>
</html>
