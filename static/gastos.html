<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar gasto</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="nav-logo">💰 Finanzas</span>
    <div class="nav-links">
      <a href="/static/index.html"   class="nav-link">Dashboard</a>
      <a href="/static/cuentas.html" class="nav-link">Cuentas</a>
      <a href="/static/gastos.html"  class="nav-link active">Gastos</a>
    </div>
  </nav>

  <main class="container">
    <div class="card" style="max-width: 480px; margin: 0 auto;">
      <h2 class="card-title">Nuevo movimiento</h2>

      <div class="form-group">
        <label>Descripción</label>
        <input type="text" id="descripcion" placeholder="ej: Supermercado HEB">
      </div>
      <div class="form-group">
        <label>Monto (negativo = gasto, positivo = ingreso)</label>
        <input type="number" id="monto" step="0.01" placeholder="ej: -850">
      </div>
      <div class="form-group">
        <label>Cuenta</label>
        <select id="cuenta"></select>
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="categoria"></select>
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>

      <button class="btn-primary" onclick="registrarGasto()">Guardar</button>
      <p id="gasto-msg" class="msg"></p>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/gastos.js"></script>
</body>
</html>
